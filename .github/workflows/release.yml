name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline (build →
# semantic-release → Docker → MCP Registry → security). Lives in
# WYRE-AI/.github so every *-mcp repo stays in lockstep.
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/.github/.github/workflows/mcp-server-release.yml@07bc1921cbd01ad8a079fe8a3dd28180080870d5
    with:
      server-name: inforcer-mcp
      image-name: ghcr.io/wyre-ai/inforcer-mcp
    secrets: inherit

  # DEPLOY TEMPORARILY DISABLED (2026-08-25 org migration fleet wave).
  #
  # The vendor Container App still runs in the LEGACY Azure tenant, while this
  # org's AZURE_* secrets point at the new WYRE AI tenant where no
  # `mcp-gateway-prod` resource group exists yet. Deploying would fail with
  # ResourceGroupNotFound. Re-enable once either (a) the fleet infra moves to
  # the WYRE AI subscription, or (b) the legacy tenant's deploy app gains a
  # repo:WYRE-AI/* federated credential and the AZURE_* secrets are
  # repo/environment-scoped back to the legacy tenant.
