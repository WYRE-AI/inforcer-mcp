
services:
  # Gateway mode. Region and API key arrive per request on X-Inforcer-* headers.
  # Do not set INFORCER_REGION, INFORCER_API_KEY, or env_file here — that would
  # put static vendor credentials in the container. Compose interpolates
  # CONDUIT_S2S_SECRET from the project .env. For AUTH_MODE=env, pass
  # INFORCER_REGION and INFORCER_API_KEY on that process instead (see the README).
  inforcer-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: inforcer-mcp:latest
    container_name: inforcer-mcp-server
    restart: unless-stopped
    environment:
      # Transport configuration. 0.0.0.0 is the interface inside the container.
      # The port publish below stays on loopback. Startup still refuses to run
      # without a real CONDUIT_S2S_SECRET.
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}

      # Optional configuration
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-inforcer-mcp}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION:-1.0.0}

      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount logs directory for persistence
      - inforcer-mcp-logs:/app/logs

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Local watch profile, not the gateway service. Static INFORCER_* here are
  # for single-tenant development only and are not loaded by inforcer-mcp.
  inforcer-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: inforcer-mcp:dev
    container_name: inforcer-mcp-dev
    working_dir: /app
    restart: "no"
    command: npm run dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - INFORCER_REGION=${INFORCER_REGION}
      - INFORCER_API_KEY=${INFORCER_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - inforcer-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  inforcer-mcp-logs:
    driver: local
  inforcer-mcp-dev-logs:
    driver: local
